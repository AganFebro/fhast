<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fhast</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 360px;
        padding: 12px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        background: #1e1e2e;
        color: #cdd6f4;
      }
      h2 {
        font-size: 14px;
        margin-bottom: 10px;
        color: #cba6f7;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        color: #a6adc8;
      }
      input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 8px;
        border: 1px solid #45475a;
        border-radius: 4px;
        background: #313244;
        color: #cdd6f4;
        font-size: 13px;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #cba6f7;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 6px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
      }
      .btn-primary {
        background: #cba6f7;
        color: #1e1e2e;
      }
      .btn-secondary {
        background: #45475a;
        color: #cdd6f4;
      }
      .btn-toggle {
        background: #a6e3a1;
        color: #1e1e2e;
      }
      .btn-danger {
        background: #f38ba8;
        color: #1e1e2e;
      }
      #status {
        margin-top: 6px;
        padding: 6px;
        border-radius: 4px;
        font-size: 12px;
        display: none;
      }
      .status-success {
        background: #a6e3a1;
        color: #1e1e2e;
      }
      .status-error {
        background: #f38ba8;
        color: #1e1e2e;
      }

      .section-divider {
        border: none;
        border-top: 1px solid #45475a;
        margin: 10px 0;
      }
      .section-title {
        font-size: 12px;
        color: #a6adc8;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .auto-grab-active {
        color: #a6e3a1;
        font-size: 11px;
        margin-bottom: 8px;
      }
      .auto-grab-inactive {
        color: #6c7086;
        font-size: 11px;
        margin-bottom: 8px;
      }
      .capture-item {
        padding: 5px 6px;
        margin-bottom: 3px;
        background: #313244;
        border-radius: 3px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
      }
      .capture-name {
        color: #cdd6f4;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 200px;
      }
      .capture-meta {
        color: #6c7086;
        white-space: nowrap;
        margin-left: 6px;
      }
      .capture-empty {
        font-size: 11px;
        color: #6c7086;
        padding: 6px;
      }
      .capture-debug {
        color: #f9e2af;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <h2>fhast</h2>
    <label for="url">URL</label>
    <input type="text" id="url" placeholder="https://example.com/file.zip" />
    <button class="btn-primary" id="send-url">Send to fhast</button>
    <button class="btn-secondary" id="send-page">Send current page URL</button>
    <div id="status"></div>

    <hr class="section-divider" />

    <div class="section-title">Auto-Grab</div>
    <button id="auto-grab-toggle" class="btn-toggle">Enable Auto-Grab</button>
    <div id="auto-grab-status" class="auto-grab-inactive"></div>
    <div id="captures-list"></div>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
