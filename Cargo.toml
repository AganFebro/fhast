[workspace]
members = [
  "crates/fhast-cli",
  "crates/fhast-core",
  "crates/fhast-daemon",
  "crates/fhast-gui",
  "crates/fhast-ipc",
  "crates/fhast-native-host",
  "crates/fhast-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["cookies", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
crossterm = "0.28"
ratatui = "0.29"
interprocess = { version = "2", features = ["tokio"] }
